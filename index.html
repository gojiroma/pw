<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>poet.blue 発行機</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f4fa8'/%3E%3Crect x='14' y='28' width='36' height='24' rx='5' fill='%23fff'/%3E%3Cpath d='M22 28v-6a10 10 0 0 1 20 0v6' fill='none' stroke='%23fff' stroke-width='5'/%3E%3Ccircle cx='32' cy='39' r='4' fill='%231f4fa8'/%3E%3Crect x='30.5' y='40' width='3' height='7' fill='%231f4fa8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* 縦一列の2ブロック。出力欄が主役、操作は右下にまとめる */
:root{
  --bg:#eef1f6; --panel:#ffffff; --fg:#1b2333; --muted:#5d6779;
  --line:#d3d9e4; --accent:#1f4fa8; --accent-fg:#ffffff; --ok:#1d7a4c; --digit:#c2410c;
  --f-ui:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11151d; --panel:#1a202b; --fg:#e4e9f2; --muted:#98a2b5;
    --line:#2d3544; --accent:#7ea6f0; --accent-fg:#0d1320; --ok:#5fcf97; --digit:#f59e5b;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11151d; --panel:#1a202b; --fg:#e4e9f2; --muted:#98a2b5;
  --line:#2d3544; --accent:#7ea6f0; --accent-fg:#0d1320; --ok:#5fcf97; --digit:#f59e5b;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--fg); font-family:var(--f-ui);
  font-size:15px; line-height:1.6;
  padding-inline:16px; padding-block:40px 56px;
}
main{max-width:720px; margin:0 auto; display:flex; flex-direction:column; gap:28px}
header h1{margin:0; font-size:1.35rem; text-wrap:balance}
header p{margin:4px 0 0; color:var(--muted); font-size:.85rem}
section{
  background:var(--panel); border:1px solid var(--line); border-radius:10px;
  padding:20px; display:flex; flex-direction:column; gap:14px; min-width:0;
}
.head{display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap}
.head h2{margin:0; font-size:1rem}
.meta{font-family:var(--f-mono); font-size:.75rem; color:var(--muted); letter-spacing:.03em}
.out{
  font-family:var(--f-mono); font-size:.92rem; line-height:1.55;
  background:var(--bg); border:1px solid var(--line); border-radius:6px;
  padding:12px 14px; min-height:3.2em; word-break:break-all; overflow-wrap:anywhere;
  user-select:all; cursor:text;
}
.out .dom{color:var(--accent); font-weight:500}
.out .num{color:var(--digit); font-weight:500}
.controls{display:flex; flex-wrap:wrap; gap:12px 16px; align-items:flex-end}
.field{display:flex; flex-direction:column; gap:4px; min-width:0}
.field.grow{flex:1 1 220px}
label{font-size:.75rem; color:var(--muted); letter-spacing:.04em}
input[type=text],select{
  font-family:var(--f-mono); font-size:.9rem; color:var(--fg);
  background:var(--bg); border:1px solid var(--line); border-radius:6px;
  padding:8px 10px; width:100%;
}
.seg{display:flex; border:1px solid var(--line); border-radius:6px; overflow:hidden}
.seg input{position:absolute; opacity:0; pointer-events:none}
.seg label{
  font-family:var(--f-mono); font-size:.85rem; color:var(--fg); letter-spacing:0;
  padding:8px 14px; cursor:pointer; background:var(--bg); border-left:1px solid var(--line);
}
.seg label:first-of-type{border-left:0}
.seg input:checked + label{background:var(--accent); color:var(--accent-fg)}
.seg input:focus-visible + label{outline:2px solid var(--accent); outline-offset:-4px}
.actions{display:flex; align-items:center; gap:12px; margin-left:auto}
button{
  font-family:var(--f-ui); font-weight:700; font-size:.9rem;
  background:var(--accent); color:var(--accent-fg); border:0; border-radius:6px;
  padding:10px 18px; cursor:pointer;
}
button:hover{filter:brightness(1.08)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.status{font-size:.8rem; color:var(--ok); min-width:6em; text-align:right}
.note{font-size:.75rem; color:var(--muted); margin:0}
@media (prefers-reduced-motion: no-preference){
  .out.flash{animation:flash .5s ease}
  @keyframes flash{from{border-color:var(--accent)}to{border-color:var(--line)}}
}
</style>
</head>
<body>
<main>
  <header>
    <h1>poet.blue 発行機</h1>
    <p>メールアドレスとパスワードをこのブラウザ内で生成します。外部には送信しません。</p>
  </header>

  <section aria-labelledby="mail-h">
    <div class="head">
      <h2 id="mail-h">メールアドレス</h2>
      <span class="meta" id="mailMeta"></span>
    </div>
    <div class="out" id="mailOut" tabindex="0"></div>
    <div class="controls">
      <div class="actions">
        <span class="status" id="mailStatus" role="status"></span>
        <button type="button" id="mailBtn64">全体64文字</button>
        <button type="button" id="mailBtn50">全体50文字</button>
        <button type="button" id="mailBtnLocal">@前64文字</button>
      </div>
    </div>
  </section>

  <section aria-labelledby="pw-h">
    <div class="head">
      <h2 id="pw-h">パスワード</h2>
      <span class="meta" id="pwMeta"></span>
    </div>
    <div class="out" id="pwOut" tabindex="0"></div>
    <div class="controls">
      <div class="field">
        <span id="lenLabel" style="font-size:.75rem;color:var(--muted);letter-spacing:.04em">文字数</span>
        <div class="seg" role="radiogroup" aria-labelledby="lenLabel">
          <input type="radio" name="len" id="len16" value="16"><label for="len16">16</label>
          <input type="radio" name="len" id="len20" value="20"><label for="len20">20</label>
          <input type="radio" name="len" id="len32" value="32"><label for="len32">32</label>
          <input type="radio" name="len" id="len64" value="64" checked><label for="len64">64</label>
          <input type="radio" name="len" id="len128" value="128"><label for="len128">128</label>
        </div>
      </div>
      <div class="field grow">
        <label for="symbols">使う記号 <label style="display:inline;margin-left:8px"><input type="checkbox" id="noSym"> なし</label></label>
        <input type="text" id="symbols" value="!#$%&amp;()*+-./:;=?@[]^_{|}~" spellcheck="false" autocomplete="off">
      </div>
      <div class="actions">
        <span class="status" id="pwStatus" role="status"></span>
        <button type="button" id="pwBtn">生成してコピー</button>
      </div>
    </div>
    <p class="note">大文字・小文字・数字・記号（「なし」選択時は除く）を必ず1文字以上含みます。記号欄はクリックで空になり、空のまま離れると元に戻ります。</p>
  </section>
</main>

<script>
(() => {
  const UPPER = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  const LOWER = "abcdefghijklmnopqrstuvwxyz";
  const DIGIT = "0123456789";
  const ALNUM = UPPER + LOWER + DIGIT;

  // 偏りのない乱数インデックス（棄却サンプリング）
  function randIndex(n) {
    const limit = Math.floor(0x100000000 / n) * n;
    const buf = new Uint32Array(1);
    while (true) {
      crypto.getRandomValues(buf);
      if (buf[0] < limit) return buf[0] % n;
    }
  }
  function randString(chars, len) {
    let s = "";
    for (let i = 0; i < len; i++) s += chars[randIndex(chars.length)];
    return s;
  }

  // 記号欄から英数字・空白を除き、重複を除去
  function symbolSet() {
    if (document.getElementById("noSym").checked) return "";
    const raw = document.getElementById("symbols").value;
    return [...new Set([...raw].filter(c => !/[A-Za-z0-9\s]/.test(c)))].join("");
  }

  const DOMAIN = "@poet.blue";
  // total=true: アドレス全体で64文字 / false: @より前が64文字
  function makeMail(total) { return randString(ALNUM, (total || 0) ? total - DOMAIN.length : 64) + DOMAIN; }

  function makePassword(len) {
    const sym = symbolSet();
    const groups = [UPPER, LOWER, DIGIT];
    if (sym) groups.push(sym);
    const all = groups.join("");
    while (true) {
      const pw = randString(all, len);
      if (groups.every(g => [...pw].some(c => g.includes(c)))) return pw;
    }
  }

  async function copy(text, outEl) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch (e) {
      const range = document.createRange();
      range.selectNodeContents(outEl);
      const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range);
      try { return document.execCommand("copy"); } catch (_) { return false; }
    }
  }

  function flash(el) { el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); }
  function setStatus(el, ok) {
    el.textContent = ok ? "コピーしました" : "選択済み・手動でコピー";
    clearTimeout(el._t); el._t = setTimeout(() => el.textContent = "", 2200);
  }

  const mailOut = document.getElementById("mailOut");
  const pwOut = document.getElementById("pwOut");
  const pwMeta = document.getElementById("pwMeta");

  // 数字の連続を色付きspanで包んで描画
  function paint(el, text) {
    el.innerHTML = "";
    for (const part of text.split(/(\d+)/)) {
      if (!part) continue;
      if (/^\d+$/.test(part)) {
        const n = document.createElement("span"); n.className = "num"; n.textContent = part; el.append(n);
      } else el.append(part);
    }
  }
  function renderMail(addr) {
    const [local] = addr.split("@");
    paint(mailOut, local);
    const d = document.createElement("span"); d.className = "dom"; d.textContent = "@poet.blue";
    mailOut.append(d);
  }
  function currentLen() { return +document.querySelector('input[name="len"]:checked').value; }
  function updateMeta() {
    const sym = symbolSet();
    pwMeta.textContent = `${currentLen()}文字 / 候補 ${62 + sym.length}種`;
  }

  const mailMeta = document.getElementById("mailMeta");
  function mailLabel(total) {
    return total ? `全体${total}文字（@前${total - DOMAIN.length}文字）` : "@前64文字（全体74文字）";
  }
  function mailHandler(total) {
    return async () => {
      const m = makeMail(total); renderMail(m); flash(mailOut);
      mailMeta.textContent = mailLabel(total);
      setStatus(document.getElementById("mailStatus"), await copy(m, mailOut));
    };
  }
  document.getElementById("mailBtn64").addEventListener("click", mailHandler(64));
  document.getElementById("mailBtn50").addEventListener("click", mailHandler(50));
  document.getElementById("mailBtnLocal").addEventListener("click", mailHandler(false));
  document.getElementById("pwBtn").addEventListener("click", async () => {
    const p = makePassword(currentLen()); paint(pwOut, p); flash(pwOut); updateMeta();
    setStatus(document.getElementById("pwStatus"), await copy(p, pwOut));
  });

  // 記号欄：フォーカスで空に、空のまま離れたら直前の値に戻す
  const symInput = document.getElementById("symbols");
  let lastSym = symInput.value;
  symInput.addEventListener("focus", () => { lastSym = symInput.value; symInput.value = ""; });
  symInput.addEventListener("blur", () => { if (symInput.value === "") symInput.value = lastSym; updateMeta(); });
  symInput.addEventListener("input", updateMeta);
  const noSym = document.getElementById("noSym");
  noSym.addEventListener("change", () => { symInput.disabled = noSym.checked; updateMeta(); });
  document.querySelectorAll('input[name="len"]').forEach(r => r.addEventListener("change", updateMeta));

  // 初期表示（コピーはしない）
  renderMail(makeMail(64));
  mailMeta.textContent = mailLabel(64);
  paint(pwOut, makePassword(currentLen()));
  updateMeta();
})();
</script>
</body>
</html>
